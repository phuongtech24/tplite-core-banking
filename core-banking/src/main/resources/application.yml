server:
  port: 8081

spring:
  application:
    name: tplite-core-banking

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tplite_core_banking_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tplite-core-banking
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.tplite.core_banking.module.notification.event

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] [%thread] %logger{36} - %msg%n"
  level:
    com.tplite.core_banking: INFO
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

app:
  seed:
    enabled: true
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-jwt-secret-key-change-me-please-32-bytes-minimum}
      expiration-millis: ${JWT_EXPIRATION_MILLIS:900000}
    refresh-token:
      expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  kafka:
    topics:
      notification-events: notification.events
