server:
  port: 8081

spring:
  application:
    name: tplite-core-banking

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: tplite-core-banking
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.tplite.core_banking.module.notification.event


  # 1. Cấu hình kết nối DB
  datasource:
    url: jdbc:postgresql://localhost:5432/tplite_core_banking_dev
    username: postgres
    password: 123456 # Điền pass DB của em vào đây
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  # 2. Cấu hình Hibernate (Tự động tạo bảng & In log SQL)
  jpa:
    hibernate:
      ddl-auto: update # Quan trọng: Spring sẽ tự lấy class Account tạo thành table accounts
    show-sql: true     # Bật để xem Hibernate sinh ra câu lệnh SQL gì
    properties:
      hibernate:
        format_sql: true # Định dạng lại SQL cho dễ đọc
        highlight_sql: true # Tô màu SQL trong console

# 3. Bật Log chuyên sâu để thấy rõ luồng ACID
logging:
  level:
    org.springframework.orm.jpa: DEBUG
    org.springframework.transaction: DEBUG

app:
  seed:
    enabled: true
  security:
    jwt:
      secret: dev-only-jwt-secret-key-change-me-please-32-bytes-minimum
      expiration-millis: 900000
    refresh-token:
      expiration-days: 7
  kafka:
    topics:
      notification-events: notification.events
